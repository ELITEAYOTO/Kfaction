  blocked-word: "&cCe nom contient un mot interdit."
  not-enough-money: "&cVous n'avez pas assez d'argent. Coût: &e{cost}$"
  failed: "&cÉchec de la création de la faction. Veuillez réessayer."
  cancelled: "&7Création de faction annulée."
  broadcast: "&6{player} &ea créé la faction &6{faction}&e!"

disband:
