# ============================================================
# Kfaction - Configuration des Quêtes
# Définit les pools de quêtes par catégorie
# ============================================================
# Chaque quête a:
#   type: block_break | entity_kill | item_smelt | item_sell
#   target: Material ou EntityType Bukkit (1.8.8)
#   sparrowmc-item: identifiant CIT exact optionnel pour item_sell
#                    (le tag level est volontairement ignoré)
#   display: Nom affiché au joueur
#   amounts: Liste de quantités possibles (choix aléatoire)
#   xp: XP par quête complétée (ou liste correspondant à amounts)
# ============================================================

# Nombre de quêtes actives par faction
active-quests: 3

# Catégorie MINEUR - Minage de blocs
mineur:
  quests:
    mine_diamond_ore:
      type: block_break
      target: DIAMOND_ORE
      display: "Miner du Diamant"
      amounts: [50, 100, 200]
      xp: [30, 60, 120]
    mine_gold_ore:
      type: block_break
      target: GOLD_ORE
      display: "Miner de l'Or"
      amounts: [100, 200, 400]
      xp: [25, 50, 100]
    mine_iron_ore:
      type: block_break
      target: IRON_ORE
      display: "Miner du Fer"
      amounts: [200, 400, 800]
      xp: [20, 40, 80]
    mine_emerald_ore:
