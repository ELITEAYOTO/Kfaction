# ============================================================
# Kfaction V2 - progression.yml
# Schema 2
# ============================================================
#
# CE FICHIER EST ACTIF.
#
# Au premier démarrage:
# - s'il n'existe pas dans plugins/Kfaction/, Kfaction copie cette ressource;
# - s'il existe déjà, Kfaction le conserve et ne l'écrase jamais.
#
# Il remplace l'ancien couple:
# - levels.yml
# - quests.yml
#
# Gameplay progression:
# niveaux + tranches de membres + quêtes + récompenses.
#
# Les réglages purement visuels de la progress-bar restent dans config.yml:
# progression-ui.progress-bar.*
#
# Validation:
#   /kf doctor progression full
#
schema-version: 2

settings:

  # Coupe totalement la progression sans effacer les données persistées.
  enabled: true

  # Niveau initial des nouvelles factions / états migrés.
  starting-level: 1

  # Broadcast interne à la faction lors d'un level-up.
  broadcast-level-up: true


# ============================================================
# CATÉGORIES
# ============================================================
#
# Les catégories sont VISUELLES.
# Elles servent aux GUI / affichages mais ne rendent pas une quête optionnelle.
#
categories:

  mining:
    display: "&bMinage"
    icon:
      material: DIAMOND_PICKAXE
      data: 0
    lore:
      - "&7Objectifs liés aux blocs et minerais."

  farming:
    display: "&aAgriculture"
    icon:
      material: WHEAT
      data: 0
    lore:
      - "&7Récoltes, élevage et ventes."

  hunting:
    display: "&cChasse"
    icon:
      material: IRON_SWORD
      data: 0
    lore:
      - "&7Mobs et combat."

  crafting:
    display: "&6Artisanat"
    icon:
      material: WORKBENCH
      data: 0
    lore:
      - "&7Crafts, fours et enchantements."

  misc:
    display: "&dDivers"
    icon:
      material: PAPER
      data: 0
    lore:
      - "&7Objectifs spéciaux et intégrations."


# ============================================================
# TRANCHES DE MEMBRES
# ============================================================
#
# RÈGLES:
# - commencent obligatoirement à 1;
# - aucune tranche ne se chevauche;
# - aucun trou entre deux tranches;
# - la dernière doit couvrir factions.members.max-per-faction.
#
# La tranche du niveau est verrouillée afin qu'une faction ne puisse pas
# réduire artificiellement sa difficulté en faisant partir des membres.
#
member-tiers:

  small:
    display: "&aPetite faction &7(1-5)"
    min-players: 1
    max-players: 5

  medium:
    display: "&eFaction moyenne &7(6-10)"
    min-players: 6
    max-players: 10

  large:
    display: "&cGrande faction &7(11-25)"
    min-players: 11
    max-players: 25

  empire:
    display: "&6Empire &7(26-50)"
    min-players: 26
    max-players: 50


# ============================================================
# NIVEAUX
# ============================================================
#
# Les niveaux doivent être CONTIGUS:
# 1, 2, 3, 4...
#
# Toutes les quêtes de la tranche active sont obligatoires.
#
levels:

  # ----------------------------------------------------------
  # NIVEAU 1 - exemples MINE / SELL / MOB_KILL
  # ----------------------------------------------------------
  1:
    display: "&eNiveau 1"
    rewards-on-enter: []

    tiers:

      small:
        quests:

          stone:
            type: MINE
            category: mining
            target: STONE
            amount: 100
            display: "&fPierre minée: &e{progress}&7/&e{amount}"
            lore:
              - "&7La pierre posée par un joueur ne compte pas."
            icon:
              material: STONE
              data: 0
            conditions:
              count-player-placed-blocks: false
              allow-silk-touch: false

          wheat_sell:
            type: SELL
            category: farming
            target: WHEAT
            amount: 32
            display: "&fBlé vendu: &e{progress}&7/&e{amount}"

          zombies:
            type: MOB_KILL
            category: hunting
            target: ZOMBIE
            amount: 10
            display: "&fZombies tués: &e{progress}&7/&e{amount}"

      medium:
        quests:

          stone:
            type: MINE
            category: mining
            target: STONE
            amount: 250
            display: "&fPierre minée: &e{progress}&7/&e{amount}"
            conditions:
              count-player-placed-blocks: false

          wheat_sell:
            type: SELL
            category: farming
            target: WHEAT
            amount: 80
            display: "&fBlé vendu: &e{progress}&7/&e{amount}"

          zombies:
            type: MOB_KILL
            category: hunting
            target: ZOMBIE
            amount: 25
            display: "&fZombies tués: &e{progress}&7/&e{amount}"

      large:
        quests:

          stone:
            type: MINE
            category: mining
            target: STONE
            amount: 500
            display: "&fPierre minée: &e{progress}&7/&e{amount}"
            conditions:
              count-player-placed-blocks: false

          wheat_sell:
            type: SELL
            category: farming
            target: WHEAT
            amount: 160
            display: "&fBlé vendu: &e{progress}&7/&e{amount}"

          zombies:
            type: MOB_KILL
            category: hunting
            target: ZOMBIE
            amount: 50
            display: "&fZombies tués: &e{progress}&7/&e{amount}"

      empire:
        quests:

          stone:
            type: MINE
            category: mining
            target: STONE
            amount: 900
            display: "&fPierre minée: &e{progress}&7/&e{amount}"
            conditions:
              count-player-placed-blocks: false

          wheat_sell:
            type: SELL
            category: farming
            target: WHEAT
            amount: 300
            display: "&fBlé vendu: &e{progress}&7/&e{amount}"

          zombies:
            type: MOB_KILL
            category: hunting
            target: ZOMBIE
            amount: 90
            display: "&fZombies tués: &e{progress}&7/&e{amount}"


  # ----------------------------------------------------------
  # NIVEAU 2 - exemples SMELT / HARVEST + reward
  # ----------------------------------------------------------
  2:
    display: "&eNiveau 2"

    rewards-on-enter:

      - id: unlock_faction_chest
        type: faction_chest_unlock
        value: 36
        description: "&6Coffre de faction débloqué"

    tiers:

      small:
        quests:

          iron_smelt:
            type: SMELT
            category: crafting
            target: IRON_INGOT
            amount: 32
            display: "&fFer fondu: &e{progress}&7/&e{amount}"

          mature_wheat:
            type: HARVEST
            category: farming
            target: CROPS:7
            amount: 64
            display: "&fBlé mûr récolté: &e{progress}&7/&e{amount}"
            conditions:
              mature-only: true

      medium:
        quests:

          iron_smelt:
            type: SMELT
            category: crafting
            target: IRON_INGOT
            amount: 80
            display: "&fFer fondu: &e{progress}&7/&e{amount}"

          mature_wheat:
            type: HARVEST
            category: farming
            target: CROPS:7
            amount: 160
            display: "&fBlé mûr récolté: &e{progress}&7/&e{amount}"
            conditions:
              mature-only: true

      large:
        quests:

          iron_smelt:
            type: SMELT
            category: crafting
            target: IRON_INGOT
            amount: 160
            display: "&fFer fondu: &e{progress}&7/&e{amount}"

          mature_wheat:
            type: HARVEST
            category: farming
            target: CROPS:7
            amount: 320
            display: "&fBlé mûr récolté: &e{progress}&7/&e{amount}"
            conditions:
              mature-only: true

      empire:
        quests:

          iron_smelt:
            type: SMELT
            category: crafting
            target: IRON_INGOT
            amount: 300
            display: "&fFer fondu: &e{progress}&7/&e{amount}"

          mature_wheat:
            type: HARVEST
            category: farming
            target: CROPS:7
            amount: 600
            display: "&fBlé mûr récolté: &e{progress}&7/&e{amount}"
            conditions:
              mature-only: true


# ============================================================
# RÉFÉRENCE - TYPES DE QUÊTES IMPLÉMENTÉS
# ============================================================
#
# La liste ci-dessous est DOCUMENTAIRE.
# Pour utiliser un type, copie un bloc de quête dans un niveau/tranche.
#
# MATERIAL:
#   MINE
#   BREAK
#   HARVEST
#   PLACE
#   SMELT
#   CRAFT
#   SELL
#   ENCHANT
#   FISH
#
# ENTITY:
#   MOB_KILL
#   SPAWNER_BREAK
#   SPAWNER_PLACE
#   BREED
#   TAME
#
# SANS TARGET:
#   PLAYER_KILL
#
# STRING / intégrations SparrowMC:
#   CUSTOM_CRAFT
#   CUSTOM_ORE_MINE
#
# Alias historiques acceptés:
#   BLOCK_BREAK -> MINE
#   ITEM_SMELT -> SMELT
#   ITEM_SELL -> SELL
#   ENTITY_KILL -> MOB_KILL
#
#
# ============================================================
# RÉFÉRENCE - CONDITIONS DE QUÊTE
# ============================================================
#
# conditions:
#
#   # true = les blocs posés par des joueurs peuvent compter.
#   count-player-placed-blocks: false
#
#   # Récoltes:
#   mature-only: true
#
#   # Minage:
#   allow-silk-touch: false
#
#   # Limites géographiques:
#   allowed-worlds:
#     - world
#
#   allowed-regions:
#     - mine_event
#
#   blocked-regions:
#     - spawn
#
#   # PLAYER_KILL:
#   victim-cooldown-seconds: 3600
#   max-per-victim-per-day: 2
#   exclude-same-faction: true
#   exclude-allies: true
#   exclude-npcs: true
#   exclude-same-ip: true
#
#
# ============================================================
# RÉFÉRENCE - ITEMS CUSTOM
# ============================================================
#
# Pour une intégration qui expose un ID SparrowMC:
#
# my_custom_ore:
#   type: CUSTOM_ORE_MINE
#   category: mining
#   target: azurite
#   amount: 10
#   display: "&fAzurite: &e{progress}&7/&e{amount}"
#
# Certains types MATERIAL peuvent aussi utiliser:
#
#   sparrowmc-item: "mon_item_custom"
#
# selon le bridge et la ValidationEnvironment disponibles.
#
#
# ============================================================
# RÉFÉRENCE - REWARDS IMPLÉMENTÉES
# ============================================================
#
# rewards-on-enter:
#
#   - id: chest
#     type: faction_chest_unlock
#     value: 36
#     description: "&6Débloque le coffre"
#
#   - id: chest_resize
#     type: faction_chest_resize
#     value: 54
#     description: "&6Passe le coffre à 54 slots"
#
#   - id: anti_sethome
#     type: anti_sethome
#     value: true
#     description: "&cAnti-Sethome débloqué"
#
#   - id: warps
#     type: warps_increase
#     value: 1
#     description: "&d+1 warp"
#
#   - id: fly
#     type: faction_fly
#     value: true
#     description: "&bFly faction débloqué"
#
#   - id: members
#     type: members_limit_increase
#     value: 5
#     description: "&a+5 membres maximum"
#
#   - id: power
#     type: faction_power_increase
#     value: 5.0
#     description: "&c+5 power"
#
#   - id: leader_points
#     type: playerpoints_leader
#     value: 100
#     description: "&e100 PlayerPoints au leader"
#
# Type présent mais réservé/futur:
#   claim_damage_reduction
#
#
# ============================================================
# PLACEHOLDERS D'AFFICHAGE VALIDES
# ============================================================
#
# {progress}
# {amount}
# {remaining}
# {percent}
# {target}
# {tier}
# {level}
# {faction}
# {members}
# {quest}
# {category}
#
# ============================================================
