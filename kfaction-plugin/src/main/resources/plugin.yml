# ============================================================
# Kfaction V2 - plugin.yml
# Minecraft / Spigot 1.8.8 - Java 8
# ============================================================
#
# Ce fichier déclare:
# - le plugin et sa classe principale;
# - les dépendances OPTIONNELLES;
# - les commandes Bukkit;
# - les permissions Bukkit/staff.
#
# IMPORTANT:
# Les permissions internes de faction (INVITE, CLAIM, SET_WARP, etc.)
# ne sont PAS les permissions Bukkit ci-dessous.
# Elles sont gérées par le Permission Engine V2 dans config.yml.
# ============================================================

name: Kfaction
version: ${project.version}
main: me.krunsh.kfaction.Kfaction
author: Krunsh
description: Plugin Factions moderne - Intégration complète avec l'écosystème K
website: https://sparrowmc.fr

# ============================================================
# DÉPENDANCES OPTIONNELLES
# ============================================================
#
# "softdepend" = Kfaction peut démarrer sans ces plugins.
# Lorsqu'ils sont présents, HookManager tente leur intégration de façon isolée.
#
# LuckPerms est optionnel et sert notamment aux contexts:
# - kfaction:has-faction
# - kfaction:faction
# - kfaction:faction-tag
# - kfaction:role
#
softdepend:
  - Vault
  - PlaceholderAPI
  - LuckPerms
  - Kcore
  - Kchat
  - Kclassement
  - WorldGuard
  - ShopGUIPlus
  - Kcraft
  - KSpawner
  - Kgenerator
  - Kminerai

# ============================================================
# COMMANDES BUKKIT
# ============================================================
commands:

  # ----------------------------------------------------------
  # Commande principale joueur
  # ----------------------------------------------------------
  f:
    description: Commande faction principale pour les joueurs
    aliases: [faction, fac]
    usage: /<command> [sous-commande]

  # ----------------------------------------------------------
  # Commande technique / staff
  # ----------------------------------------------------------
  #
  # Exemples V2:
  # /kf doctor
  # /kf doctor full
  # /kf version
  # /kf inspect <faction|joueur>
  # /kf audit status
  # /kf audit recent 20
  #
  kfaction:
    description: Commande d'administration et de diagnostic Kfaction
    aliases: [kf]
    usage: /<command> <action> [args]

    # Pas de permission globale ici.
    # KfactionAdminCommand contrôle chaque sous-commande afin que des droits
    # fins comme kfaction.admin.zone.info puissent fonctionner sans donner
    # tout kfaction.admin.

# ============================================================
# PERMISSIONS BUKKIT
# ============================================================
permissions:

  # ==========================================================
  # JOUEUR
  # ==========================================================
  kfaction.player:
    description: Groupe des permissions Kfaction accessibles aux joueurs
    default: true
    children:
      kfaction.create: true
      kfaction.join: true
      kfaction.leave: true
      kfaction.show: true
      kfaction.list: true
      kfaction.map: true
      kfaction.power: true
      kfaction.home: true
      kfaction.menu: true
      kfaction.level: true
      kfaction.quest: true
      kfaction.chest: true
      kfaction.fly: true

  kfaction.create:
    description: Créer une faction
    default: true

  kfaction.join:
    description: Rejoindre une faction
    default: true

  kfaction.leave:
    description: Quitter une faction
    default: true

  kfaction.show:
    description: Voir les informations d'une faction
    default: true

  kfaction.list:
    description: Lister les factions
    default: true

  kfaction.map:
    description: Voir la carte des territoires
    default: true

  kfaction.power:
    description: Voir son power
    default: true

  kfaction.home:
    description: Utiliser le home de faction
    default: true

  kfaction.menu:
    description: Ouvrir le menu faction
    default: true

  kfaction.level:
    description: Voir la progression/niveau de la faction
    default: true

  kfaction.quest:
    description: Voir les quêtes de progression de la faction
    default: true

  kfaction.chest:
    description: Accéder au coffre de faction si débloqué
    default: true

  kfaction.fly:
    description: Utiliser le fly faction si débloqué
    default: true

  # ==========================================================
  # BONUS POWER PAR PERMISSION
  # ==========================================================
  #
  # Le code lit les permissions:
  # kfaction.power.bonus.<clé>
  #
  kfaction.power.bonus.vip:
    description: Bonus de +2 power maximum
    default: false

  kfaction.power.bonus.mvp:
    description: Bonus de +5 power maximum
    default: false

  kfaction.power.bonus.legend:
    description: Bonus de +10 power maximum
    default: false

  # ==========================================================
  # ADMIN GLOBAL
  # ==========================================================
  #
  # Donner kfaction.admin donne toutes les permissions enfants ci-dessous.
  #
  kfaction.admin:
    description: Toutes les permissions administrateur Kfaction
    default: op
    children:
      kfaction.admin.bypass: true
      kfaction.admin.reload: true
      kfaction.admin.forcejoin: true
      kfaction.admin.forceleave: true
      kfaction.admin.forceleader: true
      kfaction.admin.disband: true
      kfaction.admin.setpower: true
      kfaction.admin.claim.warzone: true
      kfaction.admin.claim.safezone: true
      kfaction.admin.unclaim.all: true
      kfaction.admin.inspect: true
      kfaction.admin.spy: true
      kfaction.admin.setbalance: true
      kfaction.admin.rename: true
      kfaction.admin.settag: true
      kfaction.admin.lock: true
      kfaction.admin.unlock: true
      kfaction.admin.setrole: true
      kfaction.admin.teleport: true
      kfaction.admin.chat: true
      kfaction.admin.debug: true

      # V2
      kfaction.admin.grace: true
      kfaction.admin.audit: true
      kfaction.admin.doctor: true
      kfaction.admin.version: true
      kfaction.admin.zone: true

  # ==========================================================
  # STAFF - PERMISSIONS DÉTAILLÉES
  # ==========================================================

  kfaction.admin.bypass:
    description: Ignorer les protections territoriales
    default: op

  kfaction.admin.reload:
    description: Recharger la configuration Kfaction
    default: op

  kfaction.admin.forcejoin:
    description: Forcer un joueur à rejoindre une faction
    default: op

  kfaction.admin.forceleave:
    description: Forcer un joueur à quitter sa faction
    default: op

  kfaction.admin.forceleader:
    description: Forcer un transfert de leadership
    default: op

  kfaction.admin.disband:
    description: Dissoudre une faction de force
    default: op

  kfaction.admin.setpower:
    description: Modifier le power d'un joueur
    default: op

  kfaction.admin.claim.warzone:
    description: Définir un chunk en WarZone
    default: op

  kfaction.admin.claim.safezone:
    description: Définir un chunk en SafeZone
    default: op

  kfaction.admin.unclaim.all:
    description: Retirer tous les claims d'une faction
    default: op

  kfaction.admin.inspect:
    description: Inspecter les données Kfaction d'une faction ou d'un joueur
    default: op

  kfaction.admin.spy:
    description: Espionner les chats de faction
    default: op

  kfaction.admin.setbalance:
    description: Modifier le solde de la banque d'une faction
    default: op

  kfaction.admin.rename:
    description: Renommer une faction de force
    default: op

  kfaction.admin.settag:
    description: Modifier le tag d'une faction
    default: op

  kfaction.admin.lock:
    description: Verrouiller une faction
    default: op

  kfaction.admin.unlock:
    description: Déverrouiller une faction
    default: op

  kfaction.admin.setrole:
    description: Modifier le rôle d'un membre
    default: op

  kfaction.admin.teleport:
    description: Se téléporter aux homes/warps de factions pour administration
    default: op

  kfaction.admin.chat:
    description: Envoyer des messages administratifs dans un chat de faction
    default: op

  kfaction.admin.debug:
    description: Accéder aux outils de debug historiques
    default: op

  # ----------------------------------------------------------
  # Grace Period V2
  # ----------------------------------------------------------
  kfaction.admin.grace:
    description: Gérer la Grace Period V2 (/f grace start|extend|stop|reload)
    default: op

  # ----------------------------------------------------------
  # Audit V2
  # ----------------------------------------------------------
  kfaction.admin.audit:
    description: Rechercher et diagnostiquer les événements Audit V2
    default: op

  # ----------------------------------------------------------
  # Doctor V2
  # ----------------------------------------------------------
  kfaction.admin.doctor:
    description: Exécuter les diagnostics read-only /kf doctor
    default: op

  # ----------------------------------------------------------
  # Version / runtime
  # ----------------------------------------------------------
  kfaction.admin.version:
    description: Afficher les informations runtime/build /kf version
    default: op

  # ----------------------------------------------------------
  # Global Zones V2.2
  # ----------------------------------------------------------
  kfaction.admin.zone:
    description: Groupe des permissions Global Zones dynamiques
    default: op
    children:
      kfaction.admin.zone.claim: true
      kfaction.admin.zone.unclaim: true
      kfaction.admin.zone.auto: true
      kfaction.admin.zone.info: true
      kfaction.admin.zone.list: true
      kfaction.admin.zone.reload: true

  kfaction.admin.zone.claim:
    description: Assigner une Global Zone à un chunk
    default: op

  kfaction.admin.zone.unclaim:
    description: Retirer une Global Zone d'un chunk
    default: op

  kfaction.admin.zone.auto:
    description: Utiliser les modes auto claim/unclaim de Global Zones
    default: op

  kfaction.admin.zone.info:
    description: Voir la Global Zone du chunk courant
    default: op

  kfaction.admin.zone.list:
    description: Lister les Global Zones et leurs règles
    default: op

  kfaction.admin.zone.reload:
    description: Recharger les définitions zones.* sans reload complet
    default: op

  # ==========================================================
  # GROUPES STAFF OPTIONNELS
  # ==========================================================
  kfaction.staff:
    description: Groupe staff intermédiaire
    default: false
    children:
      kfaction.admin.bypass: true
      kfaction.admin.spy: true
      kfaction.admin.inspect: true
      kfaction.admin.teleport: true
      kfaction.admin.version: true

  kfaction.staff.advanced:
    description: Groupe staff avancé
    default: false
    children:
      kfaction.staff: true
      kfaction.admin.forcejoin: true
      kfaction.admin.forceleave: true
      kfaction.admin.setpower: true
      kfaction.admin.setrole: true
      kfaction.admin.audit: true
      kfaction.admin.doctor: true

  # ==========================================================
  # NOTIFICATIONS
  # ==========================================================
  kfaction.notify.faction.create:
    description: Recevoir les notifications de création de faction
    default: op

  kfaction.notify.faction.disband:
    description: Recevoir les notifications de dissolution de faction
    default: op

  kfaction.notify.admin:
    description: Recevoir les notifications d'actions administrateur
    default: op
