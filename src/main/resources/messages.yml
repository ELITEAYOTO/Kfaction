  confirm: "&cÊtes-vous sûr? Tapez &e/f disband confirm &cpour confirmer."
  not-leader: "&cSeul le chef peut dissoudre la faction."
  not-in-faction: "&cVous n'êtes pas dans une faction."
  cancelled: "&7Dissolution annulée."
  broadcast: "&cLa faction &e{name} &ca été dissoute."

