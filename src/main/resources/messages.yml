# ============================================================
# Kfaction - Messages
# Tous les messages du plugin (100% personnalisables)
# ============================================================

# Préfixe global
prefix: "&6[Faction] &r"

# ============================================================
# GÉNÉRAL
# ============================================================
general:
  no-permission: "&cVous n'avez pas la permission de faire cela."
  player-only: "&cCette commande est réservée aux joueurs."
  unknown-command: "&cCommande inconnue. Tapez &e/f help &cpour l'aide."
  reload: "&aConfiguration rechargée avec succès!"
  error: "&cUne erreur est survenue. Veuillez réessayer."
  no-faction: "&cVous n'êtes pas dans une faction."
  not-in-faction: "&cVous devez être dans une faction pour utiliser cette commande."

# ============================================================
# ERROR
# ============================================================
error:
  no-faction: "&cVous n'êtes pas dans une faction."

# ============================================================
# FACTION - Création / Gestion
# ============================================================
create:
  usage: "&cUsage: /f create <nom de faction>"
  success: "&aFaction &e{name} &acréée avec succès!"
