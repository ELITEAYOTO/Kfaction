# ============================================================
# Kfaction - Système de Niveaux de Faction
# Définit les XP requises et récompenses par niveau
# ============================================================

# Paramètres généraux
settings:
  # Activer le système de niveaux
  enabled: true
  # Nombre max de niveaux (après ce niveau, seul PlayerPoints est donné)
  max-display-level: 10
  # Message broadcast quand une faction monte de niveau
  broadcast-levelup: true
  # Barre de progression (caractères)
  progressbar-length: 20
  progressbar-filled: "▌"
  progressbar-empty: "▌"
  progressbar-color-filled: "&a"
  progressbar-color-empty: "&7"

# Définition des niveaux
# Chaque niveau a:
#   xp-required: XP totale pour atteindre ce niveau
#   rewards: Liste des récompenses automatiques
levels:
  1:
    xp-required: 500
    rewards:
      - type: faction_chest_unlock
        value: 36
        description: "&aCoffre Faction débloqué! &7(4 lignes)"
      - type: warps_increase
        value: 1
        description: "&a+1 Warp de faction"
  2:
    xp-required: 1500
    rewards:
      - type: anti_sethome
        value: true
        description: "&aAnti-Sethome activé! &7(Les ennemis ne peuvent plus /sethome dans vos claims)"
  3:
    xp-required: 3000
    rewards:
      - type: faction_chest_resize
        value: 54
        description: "&aCoffre Faction agrandi! &7(6 lignes - 54 slots)"
  4:
    xp-required: 5000
    rewards:
      - type: warps_increase
        value: 1
        description: "&a+1 Warp de faction"
      - type: faction_fly
        value: true
        description: "&a/f fly débloqué! &7(Vol dans votre territoire)"
  5:
    xp-required: 8000
    rewards:
      - type: members_limit_increase
        value: 2
        description: "&a+2 slots de membres"
      - type: playerpoints_leader
        value: 100
        description: "&a+100 PlayerPoints pour le chef!"
  6:
    xp-required: 12000
    rewards:
      - type: playerpoints_leader
        value: 100
        description: "&a+100 PlayerPoints pour le chef!"
      - type: faction_power_increase
        value: 5.0
        description: "&a+5 Power Boost"
  7:
    xp-required: 17000
    rewards:
      - type: playerpoints_leader
        value: 100
        description: "&a+100 PlayerPoints pour le chef!"
      - type: members_limit_increase
        value: 1
        description: "&a+1 slot de membre"
  8:
    xp-required: 23000
    rewards:
      - type: playerpoints_leader
        value: 150
        description: "&a+150 PlayerPoints pour le chef!"
      - type: warps_increase
        value: 1
        description: "&a+1 Warp de faction"
  9:
    xp-required: 30000
    rewards:
      - type: playerpoints_leader
        value: 150
        description: "&a+150 PlayerPoints pour le chef!"
  10:
    xp-required: 40000
    rewards:
      - type: playerpoints_leader
        value: 200
        description: "&a+200 PlayerPoints pour le chef!"
      - type: faction_power_increase
        value: 10.0
        description: "&a+10 Power Boost"
      - type: members_limit_increase
        value: 2
        description: "&a+2 slots de membres"

# Configuration du F-Chest
chest:
  # Taille initiale au déblocage (niv 1)
  initial-size: 36
  # Taille max (atteinte au niv 3)
  max-size: 54
  # Nombre max de joueurs pouvant ouvrir le chest en même temps (0 = illimité)
  max-viewers: 0
  # Sauvegarder le chest à chaque fermeture (recommandé)
  save-on-close: true

# Configuration du F-Fly
fly:
  # Désactiver automatiquement en combat
  disable-in-combat: true
  # Désactiver quand le joueur quitte le territoire
  disable-out-territory: true
  # Vitesse de vol (1.0 = normal, 0.5 = lent, 2.0 = rapide)
  speed: 1.0
  # Empêcher les dégâts de chute quand le fly est désactivé
  prevent-fall-damage: true
  # Durée de protection anti-chute en ticks (20 = 1 seconde)
  fall-protection-ticks: 60

# Configuration Anti-Sethome
anti-sethome:
  # Bloquer les ennemis
  block-enemies: true
  # Bloquer les neutres aussi
  block-neutrals: false
  # Message quand bloqué
  # (défini dans messages.yml)
