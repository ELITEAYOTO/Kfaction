      target: REDSTONE_ORE
      display: "Miner de la Redstone"
      amounts: [100, 200, 400]
      xp: [20, 40, 80]
    mine_coal_ore:
      type: block_break
      target: COAL_ORE
      display: "Miner du Charbon"
      amounts: [200, 500, 1000]
      xp: [15, 35, 70]
    mine_quartz:
      type: block_break
      target: QUARTZ_ORE
      display: "Miner du Quartz"
      amounts: [100, 250, 500]
      xp: [20, 45, 90]
    mine_obsidian:
      type: block_break
      target: OBSIDIAN
      display: "Miner de l'Obsidienne"
      amounts: [32, 64, 128]
      xp: [30, 60, 120]
    mine_stone:
      type: block_break
      target: STONE
      display: "Miner de la Pierre"
      amounts: [500, 1000, 2000]
      xp: [10, 20, 40]
    smelt_iron:
      type: item_smelt
      target: IRON_INGOT
      display: "Fondre du Fer"
      amounts: [100, 200, 500]
      xp: [25, 50, 100]
    smelt_gold:
      type: item_smelt
